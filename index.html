<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5a1912">
  <meta name="description" content="منيو بيتزا وكريب أولاد الشيخ - إمبابة - تصفح الأصناف واطلب عبر واتساب">
  <title>أولاد الشيخ | المنيو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <p class="eyebrow">أهلاً بيك في</p>
      <p class="kicker">بيتزا وكريب</p>
      <h1 id="restaurant-name">أولاد الشيخ</h1>
      <p id="restaurant-tagline" class="tagline"></p>
      <div class="hero-meta"><span>🛵 خدمة توصيل 24 ساعة</span><span>للمنازل والشركات والمكاتب والمصانع</span></div>
      <div id="call-buttons" class="call-buttons"></div>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <div>
        <p class="section-kicker">اختار اللي على مزاجك</p>
        <h2>المنيو</h2>
      </div>
      <span class="open-pill"><i></i> بنستقبل طلباتك</span>
    </section>

    <label class="search-box">
      <span aria-hidden="true">⌕</span>
      <input id="search-input" type="search" placeholder="بتدور على إيه؟" autocomplete="off">
    </label>

    <nav id="category-list" class="category-list" aria-label="أقسام المنيو"></nav>
    <div id="menu-grid" aria-live="polite"></div>
    <p id="empty-state" class="empty-state" hidden>مفيش أصناف مطابقة لبحثك.</p>
  </main>

  <aside id="cart-bar" class="cart-bar" hidden>
    <div class="cart-summary">
      <span class="cart-count" id="cart-count">0</span>
      <div><strong>طلبك</strong><small id="cart-total">0 ج.م</small></div>
    </div>
    <button id="checkout-button" class="checkout-button">اطلب عبر واتساب <span>←</span></button>
  </aside>

  <footer class="footer">
    <p id="footer-name">أولاد الشيخ</p>
    <span id="footer-address"></span>
  </footer>

  <script src="menu-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
